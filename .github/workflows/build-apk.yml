name: Build Meldin APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK 36 & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -r | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore, env, and Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          [ -f .env ] || cp .env.example .env
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "::warning::app/google-services.json is missing and GOOGLE_SERVICES_JSON secret is not set. Firebase Auth & Firestore will show setup required in this APK."
              echo "Warning: app/google-services.json was not found and GOOGLE_SERVICES_JSON secret is not set." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Collect Debug APK
        run: |
          mkdir -p artifacts
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" artifacts/Meldin-debug.apk
          echo "### Meldin APK Built Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **Meldin-debug-apk** from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meldin-debug-apk
          path: artifacts/Meldin-debug.apk
          retention-days: 30

      - name: Build Signed Release APK (when release secrets are set)
        id: release_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            gradle :app:assembleRelease --no-daemon
            REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            test -n "$REL_APK"
            cp "$REL_APK" artifacts/Meldin-release.apk
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not configured; skipping signed release APK."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release APK artifact
        if: steps.release_apk.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Meldin-release-apk
          path: artifacts/Meldin-release.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: Meldin-*-apk
          path: release-files
          merge-multiple: true

      - name: Attach APK to Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.apk

      - name: Publish Latest Rolling APK Release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Meldin APK
          prerelease: true
          files: release-files/*.apk
